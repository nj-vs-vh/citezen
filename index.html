<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Citezen</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <h1>citezen – citation formatter</h1>

    <form id="form">
      <input id="input" type="text" placeholder="DOI or arXiv ID" autofocus spellcheck="false" autocomplete="off">
      <div class="row">
        <button type="submit" id="go">Go</button>
        <label><input type="checkbox" id="shortkey" checked> Key: author+year+word</label>
      </div>
    </form>

    <div id="status" role="status"></div>
    <div class="row">
      <label>Output
        <select id="mode"><option value="bibtex">BibTeX</option><option value="citation">Citation</option></select>
      </label>
      <select id="style" hidden>
        <option value="apa">APA</option>
        <option value="vancouver">Vancouver</option>
        <option value="harvard1">Harvard</option>
      </select>
    </div>
    <textarea id="output" rows="10" readonly spellcheck="false" hidden></textarea>
    <div class="row" id="actions" hidden>
      <button type="button" id="copy">Copy</button>
      <button type="button" id="download">Download .bib</button>
    </div>
  </main>
  <script type="module" src="app.js"></script>
</body>

</html>
