<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Citezen</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <form id="form">
      <input id="input" type="text" placeholder="DOI or arXiv ID" autofocus spellcheck="false" autocomplete="off">
      <div class="row">
        <button type="submit" id="fetch">Fetch</button>
        <button type="button" id="bibtex" data-mode="bibtex" disabled>Copy BibTeX</button>
        <button type="button" id="quote" data-mode="citation" disabled>Copy full quote</button>
      </div>
    </form>

    <div id="status" role="status"></div>
    <textarea id="output" rows="8" readonly spellcheck="false" hidden></textarea>

    <details id="settings">
      <summary>Settings</summary>
      <label><input type="checkbox" data-setting="shortKey"> Readable BibTeX key (author+year+word)</label>
      <label>Citation style
        <select data-setting="style">
          <option value="apa">APA</option>
          <option value="vancouver">Vancouver</option>
          <option value="harvard1">Harvard</option>
        </select>
      </label>
    </details>
  </main>
  <script type="module" src="app.js"></script>
</body>

</html>
