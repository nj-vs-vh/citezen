<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Citezen</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <h1>Citezen</h1>
    <p class="sub">DOI → BibTeX. Paste a DOI or doi.org link.</p>

    <form id="form">
      <input id="input" type="text" placeholder="10.1038/nature12373" autofocus spellcheck="false" autocomplete="off">
      <div class="row">
        <button type="submit" id="go">Get BibTeX</button>
        <label><input type="checkbox" id="shortkey" checked> Key: author+year+word</label>
      </div>
    </form>

    <div id="status" role="status"></div>
    <textarea id="output" rows="10" readonly spellcheck="false" hidden></textarea>
    <div class="row" id="actions" hidden>
      <button type="button" id="copy">Copy</button>
      <button type="button" id="download">Download .bib</button>
    </div>
  </main>
  <script src="app.js"></script>
</body>

</html>
